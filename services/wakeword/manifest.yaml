name: wakeword
unit: skull-wakeword
backend: cpu
cuda_context: false
budget:
  vram_mb: 0
  ram_mb: 175            # ПИК: stack_2026-10-21.md (openWakeWord, VmHWM 175–177)
  measured_on: stand
residency:
  A: resident
  B: resident
  C: resident
lifecycle:
  freeze: kill
  thaw: start
  thaw_budget_s: null    # TODO: measure (restart until ready)
bus:
  in:  [audio:mic]
  out: [events:wakeword]
healthcheck: null        # TODO: systemd notify
never_evict: true
params:
  trigger: kws        # kws (openWakeWord "hey jarvis") | speech (T-038 stage 2b: ambient, Silero VAD segments, no openWakeWord)
  speech:                # Silero VAD trigger (T-038 stage 2b, core's answer 3); the RMS trigger of stage 2 is gone
    vad_model: models/vad/silero_vad.onnx
    threshold: 0.5       # speech probability per 32-ms window
    min_silence_s: 0.5   # a pause this long ends a segment
    min_speech_s: 0.25   # shorter bursts are not speech
    max_segment_s: 12    # continuous speech (podcast) is cut into segments of at most this
