name: vision
unit: skull-vision
backend: cpu                 # OpenCV FaceDetectorYN (YuNet ONNX) + Face Mesh 478 (ONNX, onnxruntime), 1 thread each
cuda_context: false
trigger: gaze                # what it publishes for now: events:vision {kind: gaze}; scene / objects — later (T-031)
budget:
  vram_mb: 0
  ram_mb: 141            # ПИК: services/vision/gaze.py with Face Mesh, 640x480 MJPG, 5 fps (VmHWM 141 over 30 min live, stand 2026-10-30); CPU 11-13 % of a core
  measured_on: stand
residency:
  A: resident
  B: evacuated
  C: evacuated
lifecycle:
  freeze: kill
  thaw: start
  thaw_budget_s: 1       # open the camera + first frame 0.3-0.5 s (T-031 step 0); not re-measured 2026-10-31: camera not attached
bus:
  in:  [camera]          # /dev/video0 (stand: usbipd from the Windows host, I-16)
  out: [events:vision]
healthcheck: null
never_evict: false
params:
  device: 0                 # /dev/video0 (stand: usbipd from the Windows host)
  width: 640
  height: 480
  threads: 1                # cv2.setNumThreads
  fourcc: MJPG              # compressed: YUYV over usbip gives green (broken) frames
  gaze:
    model: models/vision/face_detection_yunet_2023mar.onnx
    fps: 5                  # detection rate; the camera may give more
    score_min: 0.6          # YuNet face confidence; 0.8 lost the face at the bottom edge of a camera tilted up (2026-10-29)
    mesh_model: models/vision/face_landmarks_478.onnx   # MediaPipe Face Mesh with irises -> ONNX (research/vision/export_face_mesh.sh), step 1b
    presence_min: 0.5       # Face Mesh face presence on the crop
    open_min: 0.0           # eye openness (lid gap / eye width) below -> a blink, no eye feature that frame
    gaze_k: 90              # gaze_h = yaw + gaze_k * (iris_h - 0.5): eye turn ~+-45 deg across the eye width (geometry, not fitted)
    gaze_kv: -90            # gaze_v = pitch + gaze_kv * (iris_v - iris_v0) (step 1г): same scale; minus — iris_v grows down, pitch up
    iris_v0: -0.08          # iris centre vs the corner line, eyes level (median of the 30.10 recordings: looks -0.05, work -0.10)
    # «looking at the skull» = every band holds, any per-frame feature may have one (nose, yaw, pitch, iris_h, iris_v,
    # gaze_h, gaze_v); chosen by core/gaze_bands.py: gap >= 2 x spread, at most three; calibrated per placement (research/vision/gaze_calib.py):
    # step 1 (--static, 2026-10-29): nose offset — skull -0.30 [p10 -0.38, p90 -0.21], monitor centre -1.02 [p90 -0.61];
    # the working posture lay inside it (live gate: 31 false in 10 min) -> step 1b: irises (--work, 2026-10-30, camera
    # re-aimed lower): iris_h skull 0.59 (spread 0.017) vs work 0.45 (0.068), gap 2.1x; bands = [p5, p95] of the skull
    # frames; iris_h alone — 1 false in 5 min of work, iris_h + nose — 0, looks 9 of 10 (research/vision/results/gaze_1b_2026-10-30.md)
    # step 1г (2026-11-01, camera right of and above the desk): rule over --natural 600 (12 marked looks) — yaw 8.7,
    # gaze_h 4.4, nose 2.7 (gap / spread; iris_h 1.2, pitch 1.2, gaze_v 1.0); replay: 0 false, 9 of 12 at dwell 1.5 s,
    # 11 of 12 at 1.0 s (research/vision/results/gaze_1g_2026-11-01.md). Step 1b bands (camera below, left): iris_h + nose.
    # The set by the replay (core 2026-11-01: candidates by the gap, the set by the replay, fewer features first): yaw
    # alone at dwell 1.0 s — 11 of 12, 0 false, work in the band 0.1 %, longest work run 0.4 s (x2.5)
    bands:
      yaw: [-15.28, 18.44]
    frame_ttl_s: 10         # step 1в (T-053): the look's frame -> Redis vision:frame (JPEG) for brain; 0 = off
    frame_quality: 80       # JPEG quality: 640x480 ~40-60 KB
    dwell_s: 1.0            # in the bands (dropouts <= gap_s allowed) this long -> events:vision {kind: gaze}; step 1г: 1.5 -> 1.0 (replay 9/12 -> 11/12, 0 false; core 2026-11-01)
    gap_s: 0.4              # live: 4 looks -> 1 trigger without it, 2 with it (3 with dwell 1.5 s)
    min_interval_s: 10      # not more often; and the face has to turn away first
