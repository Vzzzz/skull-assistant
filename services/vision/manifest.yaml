name: vision
unit: skull-vision
backend: cpu                 # OpenCV FaceDetectorYN (YuNet ONNX) + Face Mesh 478 (ONNX, onnxruntime), 1 thread each
cuda_context: false
trigger: gaze                # what it publishes for now: events:vision {kind: gaze}; scene / objects — later (T-031)
budget:
  vram_mb: 0
  ram_mb: 141            # ПИК: services/vision/gaze.py with Face Mesh, 640x480 MJPG, 5 fps (VmHWM 141 over 30 min live, stand 2026-10-30); CPU 11-13 % of a core
  measured_on: stand
residency:
  A: resident
  B: evacuated
  C: evacuated
lifecycle:
  freeze: kill
  thaw: start
  thaw_budget_s: null    # TODO: measure (open the camera + first frame: 0.3–0.5 s on the stand)
bus:
  in:  [camera]          # /dev/video0 (stand: usbipd from the Windows host, I-16)
  out: [events:vision]
healthcheck: null
never_evict: false
params:
  device: 0                 # /dev/video0 (stand: usbipd from the Windows host)
  width: 640
  height: 480
  threads: 1                # cv2.setNumThreads
  fourcc: MJPG              # compressed: YUYV over usbip gives green (broken) frames
  gaze:
    model: models/vision/face_detection_yunet_2023mar.onnx
    fps: 5                  # detection rate; the camera may give more
    score_min: 0.6          # YuNet face confidence; 0.8 lost the face at the bottom edge of a camera tilted up (2026-10-29)
    mesh_model: models/vision/face_landmarks_478.onnx   # MediaPipe Face Mesh with irises -> ONNX (research/vision/export_face_mesh.sh), step 1b
    presence_min: 0.5       # Face Mesh face presence on the crop
    open_min: 0.0           # eye openness (lid gap / eye width) below -> a blink, no eye feature that frame
    # «looking at the skull» = every band holds; calibrated per placement (research/vision/gaze_calib.py):
    # step 1 (--static, 2026-10-29): nose offset — skull -0.30 [p10 -0.38, p90 -0.21], monitor centre -1.02 [p90 -0.61];
    # the working posture lay inside it (live gate: 31 false in 10 min) -> step 1b: irises (--work, 2026-10-30, camera
    # re-aimed lower): iris_h skull 0.59 (spread 0.017) vs work 0.45 (0.068), gap 2.1x; bands = [p5, p95] of the skull
    # frames; iris_h alone — 1 false in 5 min of work, iris_h + nose — 0, looks 9 of 10 (research/vision/results/gaze_1b_2026-10-30.md)
    bands:
      iris_h: [0.53, 0.61]
      nose: [-0.43, -0.20]
    dwell_s: 1.5            # in the band (dropouts <= gap_s allowed) this long -> events:vision {kind: gaze}
    gap_s: 0.4              # live: 4 looks -> 1 trigger without it, 2 with it (3 with dwell 1.5 s)
    min_interval_s: 10      # not more often; and the face has to turn away first
