name: vision
description: Camera at the skull's eyes; gaze trigger «looking at the skull >= 2 s» (T-031, D-029). Scene / objects — later.
backend: cpu (OpenCV FaceDetectorYN, YuNet ONNX)
residency: A                # mode A only, for now
cuda_ctx: false
vram_mb: 0
ram_mb: 93                  # peak RSS of services/vision/gaze.py on the stand (2026-10-29); CPU ~20 % of a core at 5 fps
topics:
  in: [camera]
  out: [events:vision]
healthcheck: null
params:
  device: 0                 # /dev/video0 (stand: usbipd from the Windows host)
  width: 640
  height: 480
  threads: 1                # cv2.setNumThreads
  fourcc: MJPG              # compressed: YUYV over usbip gives green (broken) frames
  gaze:
    model: models/vision/face_detection_yunet_2023mar.onnx
    fps: 5                  # detection rate; the camera may give more
    score_min: 0.6          # YuNet face confidence; 0.8 lost the face at the bottom edge of a camera tilted up (2026-10-29)
    # «looking at the skull» = nose offset band, calibrated per placement (research/vision/gaze_calib.py --static):
    # stand 2026-10-29, camera 10 cm left of the monitor, ~30° up — skull -0.30 [p10 -0.38, p90 -0.21], monitor -1.02 [p90 -0.61]
    nose_min: -0.50
    nose_max: -0.10
    dwell_s: 2.0            # in the band (dropouts <= gap_s allowed) this long -> events:vision {kind: gaze}
    gap_s: 0.4              # live: 4 looks -> 1 trigger without it, 2 with it (3 with dwell 1.5 s)
    min_interval_s: 10      # not more often; and the face has to turn away first
