name: stt
unit: skull-stt
backend: sherpa-onnx (CPU)
cuda_context: false
budget:
  vram_mb: 0
  ram_mb: 448            # ПИК: ambient на VAD-сегментах по 12 с (T-038 эт. 2б, 2026-10-28); 432 на RMS-триггере (эт. 2); после 20 фраз 396 (T-041); было 529 с faster-whisper base
  measured_on: stand
residency:
  A: resident
  B: resident
  C: evacuated
lifecycle:
  freeze: kill
  thaw: start
  thaw_budget_s: null    # TODO: measure (restart until ready)
bus:
  in:  [events:wakeword, audio:mic]
  out: [events:transcript]
healthcheck: null        # TODO: systemd notify
never_evict: false
params:
  stt:                   # D-004, T-041: GigaAM v3 CTC + punctuation and digits (sherpa-onnx, CPU); faster-whisper base retired
    model: models/stt/sherpa-onnx-nemo-ctc-punct-giga-am-v3-russian-2025-12-16
    num_threads: 2
  voice_id:              # T-039, D-029: owner / other / unknown in events:transcript
    model: models/voice/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx   # CAM++, sherpa-onnx, CPU
    owner: models/voice/owner.npy        # research/voice/enroll.py enroll (not in git)
    threshold: 0.29        # cosine; FAR 5 % at 0.284 on the stand set (research/voice/results/voiceid_2026-10-25.md)
    threshold_high: 0.45   # owner >= 0.45; uncertain 0.29..0.45 (owner_far from 0.42, false podcast 0.433) — T-039 answer 1
    voiced_rms: 150        # int16 frame RMS counted as speech; same gate as the measurement
    min_speech_s: 1.0
