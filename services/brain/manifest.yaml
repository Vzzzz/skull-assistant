name: brain
unit: skull-brain
server_unit: skull-llm   # holds the model (GPU): freeze / thaw / healthcheck act on it; `unit` (responder) stays up while brain is resident (T-044)
backend: llama-server      # D-024; server units: skull-llm (VLM, GPU), skull-embed (embedder, CPU build)
cuda_context: true
budget:
  vram_mb: 3804          # ПИК: IQ4_XS @8k + mmproj + картинка (T-033, stack_2026-10-21.md)
  ram_mb: 566            # невытесняемая часть: RssAnon skull-llm после одного CTX-1 через шину @8192 (566 / 560, два прогона 2026-10-26; ответ ядра по T-007). VmRSS там же 2427–2529 (файл весов под mmap — page cache), пик загрузки 3001 с --lazy-mode on; responder 45; эмбеддер — services/embed
  measured_on: stand
residency:
  A: resident
  B: resident             # another model: modes.B (T-044)
  C: evacuated
lifecycle:
  freeze: slot-save-kill
  thaw: start-slot-restore
  thaw_budget_s: 7       # A after B (the 26B displaced the e4b file from the page cache): /health 4.9-6.4 s (T-044, 2026-10-31); T-024 warm 3.5 s, cold 13 s (2026-10-26)
  cold_start_s: 13       # первый старт skull-llm после перезагрузки (холодный кэш страниц) до /health, 2026-10-26
bus:
  in:  [events:transcript]
  out: [events:reply]
healthcheck: http://127.0.0.1:11437/health   # llama-server (skull-llm)
never_evict: false
modes:                   # per-mode model of skull-llm (services/brain/llm_server.py reads Redis mode:current; T-044, D-030)
  B:                     # thinking: Gemma 4 26B-A4B, experts of 24 of 30 layers on the CPU (the rest of the file by mmap)
    # main model of ollama's gemma4:26b-a4b-it-mtp-q4_K_M, copied to a stable path (sha256 = the blob name, models/README):
    # independent of `ollama pull`; the plain gemma4:26b-a4b-it-q4_K_M blob does not load in llama-server (I-18)
    gguf: models/hf/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-mtp-Q4_K_M.gguf
    mmproj: null
    num_ctx: 8192
    # -ncmoe: --cpu-moe 3806 MB VRAM, 15.4 tok/s, prefill 205 tok/s; 24 -> 6606 MB, 18.6 tok/s, 249 tok/s;
    # 23 -> 7060 MB (too close to the B budget 7592), 19.4 tok/s (stand 2026-10-30)
    extra_args: ["-ncmoe", "24"]
    thaw_budget_s: 10      # start -> /health 7.0-9.2 s warm, 32.8 s with the 17 GB file out of the page cache (T-044, 2026-10-31)
    budget:
      vram_mb: 6624        # ПИК: -ncmoe 24 @8192, KV q8_0, CTX-1 at ~5k tokens (stand 2026-10-31, T-044; probe 6606)
      ram_mb: 506          # RssAnon peak over 15 switches (VmHWM 15.3-16.6 GB is the mmapped GGUF: page cache)
      measured_on: stand
params:                  # read by services/brain/responder.py and services/brain/llm_server.py; paths from repo root
  backend: llama-server
  host: http://127.0.0.1:11437
  bin: ~/llama.cpp/build-cuda/bin/llama-server
  gguf: models/quant/kostyan-e4b-iq4xs-imx.gguf
  mmproj: models/hf/gemma-4-E4B-it-GGUF/mmproj-gemma-4-E4B-it-Q8_0.gguf
  slot_save_path: models/quant/slots
  num_ctx: 8192
  temperature: 0.3
  think: false           # chat_template_kwargs.enable_thinking per request (T-033)
  persona: persona/system_prompt.md   # D-021: prompt is a model parameter; e4b → system_prompt.md
  router: true           # turn-type router + POLICY (D-026)
  ambient:               # T-038 stage 2b (D-029): turns with trigger=speech (services/wakeword params.trigger), core/ambient.py
    engaged_s: 30        # window after an answer to the name / a question has been played; any answer with content inside extends it (2в) (replay of 2026-10-27: 20 s -> 3 misses of 12, 30 s -> 1; mutters 0 either way)
    engaged_yes_p: 0.7   # in the window, a statement (no name / question): p(«да») for an answer (T-038 2в answer 2; was 0.3)
    engaged_ack_p: 0.3   # in the window: 0.3..0.7 -> «угу»; below -> silent / ack by the pause rule
    idle_yes_p: 0.7      # outside the window, no question word: p(«да») (owner, pause >= 1.5 s) for an answer (T-042 4a)
    idle_ack_p: 0.3      # outside the window: 0.3..0.7 -> «угу»
    gaze_cooldown_s: 30  # a silent look (events:vision gaze) in IDLE: one line in character, not more often (T-031)
    gaze_window_s: 15    # the window a gaze line opens; a look does not extend an open window (T-031, core 2026-10-29)
    ack_gap_s: 20        # «угу» not more often (T-038 2в, core's answer 4)
    busy_pause_s: 20     # after an aside veto: silent until this pause or the name
    veto_aside_p: 0.9    # router aside probability that vetoes (radio / podcast / call / «Алло»)
  modes:                 # T-046: the thinking mode B by the owner's voice (core/modes.py: anywhere in the turn, 1st word an imperative, the rest by stems)
    enter: [подумай как следует, подумай хорошенько, включи мозги, подумай серьёзно]
    exit: [хватит думать, достаточно думать, возвращайся, вернись]
    idle_exit_s: 300     # no owner turn this long in B -> back to A, silently
    lines:               # fixed lines, never the model (the model is being swapped)
      wait: "Сейчас."                       # the trigger heard, the switch starts
      ready: "Ну, думаю. Спрашивай."        # in B, the trigger had no question
      back: "Всё, я обратно."               # back in A by the phrase (by the timeout — silent)
      failed: "Не вышло. Остаюсь как есть." # the switch failed and was rolled back
  memory:                # associative memory beyond the window (D-026, note v6)
    k: 3
    mode: hybrid
    embed_host: http://127.0.0.1:11438
    embed_bin: ~/llama.cpp/build/bin/llama-server   # CPU build: the CUDA one creates a 176 MB context even at -ngl 0
    embed_gguf: models/hf/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
