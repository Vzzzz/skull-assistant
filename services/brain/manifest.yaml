name: brain
unit: skull-brain
backend: llama-server      # D-024; server units: skull-llm (VLM, GPU), skull-embed (embedder, CPU build)
cuda_context: true
budget:
  vram_mb: 3804          # ПИК: IQ4_XS @8k + mmproj + картинка (T-033, stack_2026-10-21.md)
  ram_mb: 3001           # ПИК RSS llama-server с --lazy-mode on (загрузка; после CTX-1 @8192 RSS 2529, из них файл весов 1839 — дочитывается по мере работы, верхняя граница ~3.5 ГБ как без lazy); responder 45, эмбеддер 0.41 ГБ — отдельно (будущий манифест memory)
  measured_on: stand
residency:
  A: resident
  B: evacuated
  C: evacuated
lifecycle:
  freeze: slot-save-kill
  thaw: start-slot-restore
  thaw_budget_s: 4       # замер T-024 (thaw ≈ 3.5 с); перезапуск skull-llm до /health 3.6–3.8 с при прогретом кэше, 13 с при холодном (2026-10-26)
bus:
  in:  [events:transcript]
  out: [events:reply]
healthcheck: http://127.0.0.1:11437/health   # llama-server (skull-llm)
never_evict: false
params:                  # read by services/brain/responder.py and services/brain/llm_server.py; paths from repo root
  backend: llama-server
  host: http://127.0.0.1:11437
  bin: ~/llama.cpp/build-cuda/bin/llama-server
  gguf: models/quant/kostyan-e4b-iq4xs-imx.gguf
  mmproj: models/hf/gemma-4-E4B-it-GGUF/mmproj-gemma-4-E4B-it-Q8_0.gguf
  slot_save_path: models/quant/slots
  num_ctx: 8192
  temperature: 0.3
  think: false           # chat_template_kwargs.enable_thinking per request (T-033)
  persona: persona/system_prompt.md   # D-021: prompt is a model parameter; e4b → system_prompt.md
  router: true           # turn-type router + POLICY (D-026)
  memory:                # associative memory beyond the window (D-026, note v6)
    k: 3
    mode: hybrid
    embed_host: http://127.0.0.1:11438
    embed_bin: ~/llama.cpp/build/bin/llama-server   # CPU build: the CUDA one creates a 176 MB context even at -ngl 0
    embed_gguf: models/hf/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
