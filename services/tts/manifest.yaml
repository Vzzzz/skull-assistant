name: tts
unit: skull-tts
backend: cpu
cuda_context: false
budget:
  vram_mb: 0
  ram_mb: 423            # ПИК с sox pitch/reverb по предложению через pipe (хвост T-003, 2026-10-27); без sox 374, синтез целого ответа 486
  measured_on: stand
residency:
  A: resident
  B: resident
  C: evacuated
lifecycle:
  freeze: kill
  thaw: start
  thaw_budget_s: 1.5     # start -> «dmitri ready» 0.95-1.02 s (stand 2026-10-31)
bus:
  in:  [events:reply]
  out: [tts:speaking]
healthcheck: null        # TODO: systemd notify
never_evict: false
params:
  sfx:
    transition: services/tts/sfx/thinking.wav   # looped from events:mode begin to done / failed (T-046, U-003: a stub — HDD clicks by sox, services/tts/sfx/make_thinking.sh; the real sample is the owner's choice)
